[project]
name = "fastapikeycloak"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "python-jose[cryptography]>=3.3.0",
    "loguru>=0.7.3",
    "requests>=2.34.2",
    "pydantic-settings>=2.0.0",
    "arrow>=1.4.0",
    "uvicorn[standard]>=0.30.0",
    "pyjwt>=2.15.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx2>=0.5.0",
    "pytest-mock>=3.12.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "ruff>=0.17.0",
]

[tool.pyright]
reportArgumentType = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (style)
    "F",   # pyflakes (undefined names, unused imports, ...)
    "W",   # pycodestyle warnings
    "I",   # import sorting (isort)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (common mistakes)
    "S",   # flake8-bandit-style security rules (fast, complements bandit)
    "SIM", # simplifications
    "C4",  # comprehension best practices
]
ignore = [
    "B008", # Do not perform function call in argument defaults (false positive for FastAPI Depends)
    "S104", # Binding to all interfaces (acceptable for development)
]
per-file-ignores = { "tests/*.py" = ["S101"] }
